name: CI

# Lo que se puede verificar sin GPU: que el código compile, que pase el
# análisis estático y que no entre una credencial nueva. Probar el STT de
# verdad necesita el modelo y una GPU, y eso no corre en un runner de GitHub.
#
# El análisis de SonarQube no corre acá: el servidor es local. Se corre a mano:
#
#   reestructuracion/herramientas/escanear/sonar.sh signall-stt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: python -m compileall
        run: python -m compileall -q app scripts

  leaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks 8.30.1 sobre el árbol
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --verbose
