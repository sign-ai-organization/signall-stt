# Proyecto de SonarQube local para signall-stt.
#
#   reestructuracion/herramientas/escanear/sonar.sh signall-stt
#
# Python no necesita binarios: el scanner lo analiza directo. La cobertura se
# puede sumar cuando exista el primer test, con sonar.python.coverage.reportPaths.

sonar.projectKey=signall-stt
sonar.projectName=signall-stt
sonar.sourceEncoding=UTF-8

sonar.sources=app,scripts
# El repo no tiene carpeta `tests/`: si se agrega, descomentar.
#sonar.tests=tests

sonar.exclusions=\
  **/__pycache__/**, \
  **/build/**, \
  **/fixtures/**

#sonar.python.coverage.reportPaths=coverage.xml
