# Proyecto de SonarQube local para signall-stt.
#
#   reestructuracion/herramientas/escanear/sonar.sh signall-stt
#
# Python no necesita binarios: el scanner lo analiza directo. La cobertura se
# puede sumar cuando exista el primer test, con sonar.python.coverage.reportPaths.

sonar.projectKey=signall-stt
sonar.projectName=signall-stt
sonar.sourceEncoding=UTF-8

sonar.sources=app,scripts
# Los tests no se cuentan como código del servicio: cubren `app/`.
sonar.tests=tests

sonar.exclusions=\
  **/__pycache__/**, \
  **/build/**, \
  **/fixtures/**

# Lo genera `scripts/cobertura.sh` con `coverage xml`. Las rutas del reporte son
# relativas a la raíz (`.coveragerc`, `relative_files`): el escáner corre en otro
# contenedor y con rutas absolutas no engancharía ningún archivo.
sonar.python.coverage.reportPaths=coverage.xml

# Los scripts son el instrumento (verificación y utilidades de escritorio), no
# código del servicio: que `verify_session.py` no tenga cobertura no dice nada
# de `app/`. El código que importa medir es `app/`.
sonar.coverage.exclusions=scripts/**
